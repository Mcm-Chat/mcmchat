apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.mcm.privateconnect"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mcm.privateconnect"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.mcmVersionCode
        versionName rootProject.ext.mcmVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // Dibaca dari environment / GitHub Secrets. Keystore tidak pernah di-commit.
            def storePath = System.getenv("MCM_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("MCM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MCM_KEY_ALIAS")
                keyPassword System.getenv("MCM_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("MCM_KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        // Capacitor 7 mengompilasi dengan JDK 21 (lihat capacitor.build.gradle).
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = "21" }
    bundle { language { enableSplit = false } }
}

repositories { google(); mavenCentral(); flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$rootProject.ext.androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "com.google.firebase:firebase-messaging:$rootProject.ext.firebaseMessagingVersion"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// File generated oleh `cap sync` (jangan diedit manual).
apply from: 'capacitor.build.gradle'

// Sumber kebenaran config klien Firebase ada di android/firebase/google-services.json
// (file klien, TANPA private key/service account). Disalin ke modul app bila belum ada,
// karena path android/app/google-services.json diabaikan oleh .gitignore repo.
def fallbackGoogleServices = rootProject.file('firebase/google-services.json')
if (!file('google-services.json').exists() && fallbackGoogleServices.exists()) {
    copy {
        from fallbackGoogleServices
        into projectDir
    }
    logger.lifecycle('MCM: google-services.json disalin dari android/firebase/.')
}

// google-services.json disiapkan pemilik akun; jangan gagal build bila belum ada.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle('MCM: google-services.json ditemukan — push FCM aktif pada build ini.')
} else {
    logger.warn('MCM: google-services.json TIDAK ada — build tetap jalan, tetapi APK/AAB ini tidak menerima push FCM.')
}
