name: Android Release (AAB)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL produksi yang dibungkus Capacitor"
        default: "https://mcmchat.id"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # google-services.json tidak pernah di-commit; disuntik dari secret (base64).
      - name: Inject FCM config
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Sync Capacitor
        run: bunx cap sync android
        env:
          MCM_APP_URL: ${{ github.event.inputs.app_url }}

      # Keystore juga hanya hidup di runner, tidak pernah masuk repo.
      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/mcm-release.jks"

      - name: Build signed AAB
        working-directory: android
        env:
          MCM_KEYSTORE_PATH: ${{ runner.temp }}/mcm-release.jks
          MCM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MCM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MCM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Cleanup secrets on runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mcm-release.jks" android/app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: mcm-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
