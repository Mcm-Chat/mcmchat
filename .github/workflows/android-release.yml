name: Android Release (AAB)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL produksi yang dibungkus Capacitor"
        default: "https://mcmchat.lovable.app"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-release.yml"
      - "public/.well-known/assetlinks.json"
      - "android/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # Secret opsional harus lewat env: GitHub melarang `secrets.*` di dalam `if:`.
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Nilai VITE_SUPABASE_* bersifat publik dan sudah ikut repo lewat `.env`;
      # jangan diambil dari GitHub Secrets.
      - run: bun run build:web

      # Gate wajib: rilis dibatalkan bila fingerprint App Links masih placeholder.
      # Guard pemisahan APK: repo ini hanya membangun aplikasi chat privat.
      - name: Verifikasi identitas aplikasi
        run: bun run verify:identity

      - name: Catatan App Links
        run: |
          echo "App Links belum digate fingerprint: keystore upload MCM Chat dibuat/dipulihkan di runner."
          echo "Setelah AAB diunggah ke Play Console, salin SHA-256 Play App Signing ke public/.well-known/assetlinks.json."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.10.1 minimum JDK 17; proyek memakai 21 karena Capacitor 7 menargetkan Java 21.
          java-version: "21"
      # Runner ubuntu-latest sudah menyertakan Android SDK; pakai sdkmanager langsung
      # agar tidak bergantung pada action pihak ketiga yang gagal.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan, memasang commandline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # Prioritaskan secret; gunakan salinan konfigurasi Firebase yang tersimpan sebagai fallback.
      - name: Inject FCM config
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ -f android/firebase/google-services.json ]; then
            cp android/firebase/google-services.json android/app/google-services.json
          fi

      - name: Status FCM
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "FCM: google-services.json terpasang — push aktif pada build ini."
          else
            echo "::warning title=Push nonaktif::google-services.json tidak ada (secret GOOGLE_SERVICES_JSON_BASE64 belum diisi). Build tetap jalan, tetapi APK/AAB ini TIDAK menerima push FCM."
          fi

      - name: Sync Capacitor
        run: bunx cap sync android
        env:
          MCM_APP_URL: ${{ github.event.inputs.app_url || 'https://mcmchat.lovable.app' }}

      # Wrapper resmi (Gradle 8.11.1) ikut ter-commit di android/gradle/wrapper.
      - name: Verifikasi Gradle wrapper
        run: test -f android/gradlew && test -f android/gradle/wrapper/gradle-wrapper.jar

      # Keystore hanya hidup di runner + artifact backup; tidak pernah masuk repo.
      - name: Restore or create MCM Chat signing key
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Secret kosong::$name belum diisi di repository secrets"
              exit 1
            fi
          done

          KS="$RUNNER_TEMP/mcm-chat-release.jks"
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="mcm-chat-signing-key-backup" and .expired==false)] | sort_by(.created_at) | last | .id // empty')"

          if [ -n "$ART_ID" ]; then
            echo "Memulihkan keystore dari artifact backup #$ART_ID"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > "$RUNNER_TEMP/key-backup.zip"
            unzip -o -q "$RUNNER_TEMP/key-backup.zip" -d "$RUNNER_TEMP/key-backup"
            cp "$RUNNER_TEMP/key-backup/mcm-chat-release.jks" "$KS"
            rm -rf "$RUNNER_TEMP/key-backup" "$RUNNER_TEMP/key-backup.zip"
          else
            echo "Belum ada backup — membuat keystore baru khusus MCM Chat"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=MCM Private Connect, OU=Mobile, O=MCM, L=Indonesia, C=ID" > /dev/null 2>&1
          fi
          chmod 600 "$KS"

          if ! keytool -list -keystore "$KS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Keystore tidak valid::Store password atau alias tidak cocok dengan keystore"
            exit 1
          fi

          FP="$(keytool -list -v -keystore "$KS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d '\r')"

          {
            echo "MCM Chat upload signing key"
            echo "package: com.mcm.privateconnect"
            echo "alias: $ANDROID_KEY_ALIAS"
            echo "upload cert SHA-256: $FP"
            echo "keystore: mcm-chat-release.jks (JKS, RSA 2048, validity 10000 hari)"
            echo "Password TIDAK disimpan di file ini; simpan hanya di GitHub Secrets."
          } > "$RUNNER_TEMP/SIGNING-KEY-README.txt"

          {
            echo "### MCM Chat signing key"
            echo ""
            echo '- package: com.mcm.privateconnect'
            echo "- alias: $ANDROID_KEY_ALIAS"
            echo "- upload cert SHA-256: $FP"
          } >> "$GITHUB_STEP_SUMMARY"

      # Backup diunggah SEBELUM Gradle agar key tetap bisa dipakai ulang bila build gagal.
      - name: Backup signing key artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcm-chat-signing-key-backup
          path: |
            ${{ runner.temp }}/mcm-chat-release.jks
            ${{ runner.temp }}/SIGNING-KEY-README.txt
          retention-days: 90
          compression-level: 0

      - name: Build signed AAB
        working-directory: android
        env:
          MCM_KEYSTORE_PATH: ${{ runner.temp }}/mcm-chat-release.jks
          MCM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MCM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MCM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verifikasi manifest AAB
        run: bun run verify:aab

      - name: Cleanup secrets on runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mcm-chat-release.jks" "$RUNNER_TEMP/SIGNING-KEY-README.txt" android/app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: mcm-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
