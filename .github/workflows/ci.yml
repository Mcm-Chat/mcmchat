name: CI

on:
  pull_request:
  push:
    branches: [main, production]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-security-regression:
    name: Regresi keamanan database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Gate wajib: PIN, izin bucket avatar, hapus anggota jalur admin,
      # keanggotaan percakapan, dan invariant RLS lainnya.
      - name: Uji invariant keamanan DB
        run: bun run test:security

  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsgo --noEmit
      - run: bun run lint
      - run: bun run test
      - run: bun run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Laporan ukuran bundle
        run: |
          du -sh dist 2>/dev/null || true
          find dist -name '*.js' -size +300k -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -20 || true

  android-static:
    name: Pemeriksaan statis Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: targetSdk/compileSdk harus 36
        run: grep -q "compileSdkVersion = 36" android/variables.gradle && grep -q "targetSdkVersion = 36" android/variables.gradle
      - name: Format assetlinks (informasional selama fingerprint belum diisi)
        continue-on-error: true
        run: bun run verify:assetlinks

  dependency-audit:
    name: Audit dependensi
    runs-on: ubuntu-latest
    # Registri eksplisit: tanpa ini `bun audit` bisa memakai registri mirror
    # (mis. cache sandbox) yang tidak punya endpoint advisory dan membalas 404.
    env:
      BUN_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Audit (gagal pada high/critical)
        run: bun audit --audit-level=high

  pwa-smoke:
    name: Smoke E2E PWA mobile (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Pasang Playwright Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium
      # Build produksi memakai preset Cloudflare/Nitro yang tidak bisa dilayani
      # `vite preview`, jadi smoke test dijalankan terhadap server dev.
      - name: Jalankan server aplikasi
        run: |
          mkdir -p e2e-artifacts
          nohup bun run dev > e2e-artifacts/dev-server.log 2>&1 &
          disown || true
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "Server tidak siap dalam 180 detik"; tail -50 e2e-artifacts/dev-server.log; exit 1
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Smoke test navigasi + halaman utama
        run: bun run test:e2e:pwa
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      - name: Unggah artefak smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-smoke-${{ github.sha }}
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14

  sbom:
    name: SBOM (CycloneDX + SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Buat SBOM
        run: bun run sbom
      - name: Ringkasan SBOM
        run: |
          node -e "const b=require('./sbom/sbom.cyclonedx.json');console.log('CycloneDX',b.specVersion,'komponen:',b.components.length)"
          node -e "const s=require('./sbom/sbom.spdx.json');console.log('SPDX',s.spdxVersion,'paket:',s.packages.length)"
      - name: Unggah artefak SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  production-gate:
    name: Gate sebelum merge ke production
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    needs: [db-security-regression, quality, dependency-audit, sbom, pwa-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Semua gate keamanan lolos
        run: echo "Regresi keamanan DB, typecheck, test, build, audit dependensi, dan smoke PWA lolos."
